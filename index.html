<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="app-build" content="2025-09-01-01" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>キャラ図鑑</title>
  <link rel="stylesheet" href="style.css?v=2025-09-01-01" />
    <!-- color UI + color math -->
  <script src="https://unpkg.com/iro@5.5.2/dist/iro.min.js"></script>
  <script src="https://unpkg.com/culori@3.3.0/dist/culori.umd.min.js"></script>

</head>
<body>
  <!-- アプリ全体ラッパ -->
  <div class="app">

    <!-- ヘッダー／ツールバー -->
    <header class="header" role="banner">
      <div class="header-inner">

        <div class="branding">
          <h1 class="app-title">キャラ図鑑</h1>
        </div>

        <!-- フィルタ群（横スクロール可能） -->
        <div class="filters" role="navigation" aria-label="シリーズで絞り込み">
          <div class="series-filter" id="series-filter" role="tablist">
            <button class="chip is-active" data-series="all" role="tab" aria-selected="true">全シリーズ</button>
            <button class="chip" data-series="ねこニャ町" role="tab" aria-selected="false">ねこニャ町</button>
            <button class="chip" data-series="四角丸町" role="tab" aria-selected="false">四角丸町</button>
            <button class="chip" data-series="にじいろ学校" role="tab" aria-selected="false">にじいろ学校</button>
            <button class="chip" data-series="investigating" role="tab" aria-selected="false">調査中</button>
          </div>
        </div>

        <!-- 右側アクション -->
        <div class="actions">
          <label class="search" aria-label="キーワード検索">
            <input id="search-box" class="search-input" type="search" placeholder="キーワード検索…" inputmode="search" />
          </label>

          <div class="palette">
            <button class="icon-btn" id="palette-btn" aria-label="テーマカラー">🎨</button>
            <div class="palette-panel" id="palette-panel" hidden></div>
          </div>

          <button class="icon-btn" id="edit-btn" aria-label="編集モード">✎</button>
        </div>

      </div>
    </header>

    <!-- 調査状況サマリーバー -->
    <section class="summary-bar" role="region" aria-label="調査状況">
      <div class="summary-inner">
        <div class="summary-head">
          <span class="summary-title">調査状況</span>
          <div class="summary-pills">
            <button id="sum-pill-done" class="sum-pill" data-filter="done" aria-pressed="false" aria-label="調査済だけ表示">
              <span class="dot dot-done" aria-hidden="true"></span><span class="pill-label">調査済</span>
              <b id="sum-count-done" class="pill-count">0</b>
            </button>
            <button id="sum-pill-wip" class="sum-pill" data-filter="wip" aria-pressed="false" aria-label="調査中だけ表示">
              <span class="dot dot-wip" aria-hidden="true"></span><span class="pill-label">調査中</span>
              <b id="sum-count-wip" class="pill-count">0</b>
            </button>
          </div>
        </div>

        <div class="progressbar" aria-hidden="true">
          <div id="sum-bar-done" class="bar-seg bar-done" style="width:0%"></div>
          <div id="sum-bar-wip" class="bar-seg bar-wip" style="width:0%"></div>
        </div>

        <div class="summary-numbers">
          調査済 <b id="sum-txt-done">0</b> / <b id="sum-txt-total">0</b>（<b id="sum-txt-rate">0%</b>）｜
          調査中 <b id="sum-txt-wip">0</b>
          <button id="sum-clear" class="sum-clear" hidden>✕ すべて表示</button>
        </div>
      </div>
    </section>

    <!-- 一覧ビュー -->
    <main id="list-view" role="main" aria-live="polite">
      <div id="card-list" class="card-grid"></div>
    </main>

    <!-- 詳細ビュー -->
    <section id="detail-view" class="detail hidden" aria-label="キャラ詳細">
      <div class="detail-hero">
        <!-- 背景はCSSでオブジェクトフィット。低解像の仮画像→本画像へはJS -->
        <img id="detail-bg" class="detail-bg" alt="" />
        <div class="nav">
          <button class="nav-button prev" aria-label="前のキャラ">‹</button>
          <button class="nav-button next" aria-label="次のキャラ">›</button>
        </div>
        <div class="hero-inner">
        <img id="detail-img" class="detail-img" alt="" />
          <section class="panel summary" >
            <div id="character-summary" aria-label="キャラ概要">
          </section>
        </div>
      </div>

      <div class="detail-content">
        <section id="profile" class="panel" aria-label="プロフィール"></section>
        <section id="appearance" class="panel" aria-label="見た目"></section>
        <section id="memo" class="panel" aria-label="メモ"></section>
        <div class="detail-footer">
          <button class="back-button" aria-label="一覧に戻る">← 一覧に戻る</button>
        </div>
      </div>

      <!-- 編集アクション（編集時のみ表示） -->
      <div id="edit-actions" class="edit-actions" hidden>
        <button id="edit-save" class="btn-primary">保存</button>
        <button id="edit-cancel" class="btn-ghost">取消</button>
      </div>
    </section>

    <!-- パスワード入力モーダル -->
    <div id="pw-modal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pw-title">
        <h3 id="pw-title">編集パスワード</h3>
        <input id="pw-input" type="password" placeholder="パスワード" inputmode="text" autocomplete="current-password" />
        <div id="pw-error" class="field-error" hidden>パスワードを入力してください。</div>
        <div class="modal-actions">
          <button id="pw-ok" class="btn-primary">OK</button>
          <button id="pw-cancel" class="btn-ghost">キャンセル</button>
        </div>
      </div>
    </div>
<!-- 新規パレット（機能付き） -->
    <div id="palette-new-modal" class="modal palette-new" hidden>
      <div class="modal-backdrop"></div>

      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pnm-title">
        <!-- 内側を読みやすいカードにして、外側はベース色でプレビュー -->
        <div class="pnm-inner">
          <h3 id="pnm-title">新しいパレット</h3>
          <p class="muted">ベース／アクセント／サブの3色を指定します。下でレイアウトの見え方を確認できます。</p>

          <!-- クリック一度目で出る“リストのバー”イメージ -->
          <div class="pnm-listbar" aria-label="リストのバーのイメージ">
            <div class="bars">
              <span class="base"></span>
              <span class="accent"></span>
              <span class="sub"></span>
            </div>
            <div class="name">（新規パレット）</div>
          </div>

          <!-- 上段：色入力（各行でピッカー/既定色/コードを切替） -->
          <section class="pnm-inputs" id="pnm-inputs">
            <!-- ベース -->
            <div class="pnm-row" data-key="base">
              <label class="pnm-key">ベース<br><small>画面の背景・テキスト</small></label>
              <div class="pnm-slot">
                <div class="pnm-swatch"></div>
                <div class="pnm-tabs" role="tablist" aria-label="ベースの入力方法">
                  <button class="is-active" data-mode="picker" role="tab" aria-selected="true">ピッカー</button>
                  <button data-mode="preset" role="tab" aria-selected="false">既定色</button>
                  <button data-mode="code"   role="tab" aria-selected="false">コード</button>
                </div>
                <div class="pnm-ctrls">
                  <input class="ctrl ctrl-picker" type="color" value="#888888">
                  <select class="ctrl ctrl-preset" hidden></select>
                  <input class="ctrl ctrl-code"   hidden placeholder="#RRGGBB">
                </div>
              </div>
            </div>

            <!-- アクセント -->
            <div class="pnm-row" data-key="accent">
              <label class="pnm-key">アクセント<br><small>ボタン・強調</small></label>
              <div class="pnm-slot">
                <div class="pnm-swatch"></div>
                <div class="pnm-tabs" role="tablist" aria-label="アクセントの入力方法">
                  <button class="is-active" data-mode="picker" role="tab" aria-selected="true">ピッカー</button>
                  <button data-mode="preset" role="tab" aria-selected="false">既定色</button>
                  <button data-mode="code"   role="tab" aria-selected="false">コード</button>
                </div>
                <div class="pnm-ctrls">
                  <input class="ctrl ctrl-picker" type="color" value="#7A6B58">
                  <select class="ctrl ctrl-preset" hidden></select>
                  <input class="ctrl ctrl-code"   hidden placeholder="#RRGGBB">
                </div>
              </div>
            </div>

            <!-- サブ -->
            <div class="pnm-row" data-key="sub">
              <label class="pnm-key">サブ<br><small>カード背景など</small></label>
              <div class="pnm-slot">
                <div class="pnm-swatch"></div>
                <div class="pnm-tabs" role="tablist" aria-label="サブの入力方法">
                  <button class="is-active" data-mode="picker" role="tab" aria-selected="true">ピッカー</button>
                  <button data-mode="preset" role="tab" aria-selected="false">既定色</button>
                  <button data-mode="code"   role="tab" aria-selected="false">コード</button>
                </div>
                <div class="pnm-ctrls">
                  <input class="ctrl ctrl-picker" type="color" value="#D7E3E6">
                  <select class="ctrl ctrl-preset" hidden></select>
                  <input class="ctrl ctrl-code"   hidden placeholder="#RRGGBB">
                </div>
              </div>
            </div>
          </section>
<!-- カラーアシスタント（ベース→サジェスト生成） -->
          <section class="pnm-assistant" aria-label="カラーアシスタント">
            <div class="assist-left">
              <h4>ベースをホイールで選ぶ</h4>
              <div id="baseColorWheel" class="wheel"></div>
              <div class="lc-controls">
                <label>明るさ L <input id="baseL" type="range" min="0" max="1" step="0.01"></label>
                <label>鮮やかさ C <input id="baseC" type="range" min="0" max="0.25" step="0.005"></label>
              </div>
              <p class="tip">※ライト基調では L を高め・C を低めが読みやすいです</p>
            </div>

            <div class="assist-right">
              <h4>サジェスト（クリックで適用）</h4>
              <div id="suggestGroups" class="suggest-groups">
                <!-- JSで 補色 / 分割補色 / トライアド の3グループを生成 -->
              </div>
            </div>
          </section>

          <!-- 下段：プレビュー（左＝カード視認性、右＝画面ミニレイアウト） -->
          <section class="pnm-preview">
            <div class="pnm-card-preview" aria-label="カード視認性プレビュー">
              <div class="mock-card">
                <div class="mock-thumb"></div>
                <div class="mock-title">ダミーカードのタイトル</div>
                <div class="mock-sub">サブテキストがここに入ります</div>
              </div>
            </div>

            <div class="pnm-layout-preview" aria-label="全体レイアウトプレビュー">
              <div class="mock-header">ヘッダー</div>
              <div class="mock-list">
                <div class="mock-item"></div>
                <div class="mock-item"></div>
                <div class="mock-item"></div>
              </div>
              <div class="mock-cta">ボタン</div>
            </div>
          </section>

          <div class="modal-actions">
            <button id="pnm-try" class="btn-ghost" type="button" title="この配色を一時的に適用して画面全体で試す">一時適用</button>
            <div class="spacer"></div>
            <button id="pnm-cancel" class="btn-ghost" type="button">閉じる</button>
            <button id="pnm-save" class="btn-primary" type="button" disabled>保存（モック）</button>
          </div>
        </div>
      </div>
    </div>


  </div><!-- /.app -->
  <!-- フルスクリーン表示モーダル -->
  <div id="fs-modal" hidden>
    <div class="fs-backdrop"></div>
    <div class="fs-stage">
      <div class="fs-canvas">
        <img id="fs-bg" class="fs-bg" alt="">
        <img id="fs-char" class="fs-char" alt="">
      </div>
      <button id="fs-prev" class="fs-nav fs-prev" aria-label="前">‹</button>
      <button id="fs-next" class="fs-nav fs-next" aria-label="次">›</button>      
      <button id="fs-close" class="fs-close" aria-label="閉じる">×</button>
    </div>
  </div>

  <!-- 末尾でJS（キャッシュ回避用のビルド番号付き） -->
  <script src="script.js?v=2025-09-01-01"></script>
</body>
</html>
